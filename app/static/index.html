<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Realtime Narration Video</title>
  <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
  <main>
    <header>
      <div class="header-row">
        <p class="eyebrow">LTX-2.5 / AivisSpeech</p>
        <label class="language-picker"><span data-i18n="uiLanguage">表示言語</span>
          <select id="ui-language" aria-label="表示言語">
            <option value="ja">日本語</option>
            <option value="en">English</option>
          </select>
        </label>
      </div>
      <h1>Realtime Narration Video</h1>
      <p data-i18n="tagline">文章を約5秒ずつ音声化し、生成できた映像から順番に再生します。</p>
    </header>
    <section class="panel input-panel">
      <form id="form">
        <input name="ui_language" id="ui-language-form" type="hidden" value="ja">
        <label><span data-i18n="characterImage">キャラクター画像</span>
          <span class="drop-zone image-drop" id="character-drop">
            <input name="character" id="character-input" type="file" accept="image/png,image/jpeg,image/webp" required>
            <img id="character-preview" alt="キャラクタープレビュー" data-i18n-alt="characterPreview" hidden>
            <span class="drop-copy"><b data-i18n="dropImage">画像をドロップ</b><small data-i18n="dropImageHint">PNG・JPEG・WebP／クリックして選択</small></span>
          </span>
        </label>
        <label><span data-i18n="sceneDirection">映像の方向性</span><input name="concept" placeholder="落ち着いたスタジオで説明する" data-i18n-placeholder="scenePlaceholder"></label>
        <label><span data-i18n="characterType">キャラクター種別</span>
          <select name="character_mode">
            <option value="standard" data-i18n="characterStandard">標準（イラスト・3D）</option>
            <option value="photoreal" selected data-i18n="characterPhotoreal">実写・口動作優先</option>
          </select>
        </label>
        <label><span data-i18n="lipSetting">実写の発話設定</span>
          <select name="lip_sync_mode">
            <option value="fast" selected data-i18n="lipFast">高速（口開き画像を使用）</option>
            <option value="strong" data-i18n="lipStrong">口動作優先（会話もmodality 1.3）</option>
          </select>
        </label>
        <label><span data-i18n="videoProfile">動画プロファイル</span>
          <select name="video_profile" id="video-profile">
            <optgroup label="16fps・解像度優先" data-i18n-label="profile16">
              <option value="16fps-resolution">640×352（16:9）</option>
              <option value="16fps-5x3" data-i18n="profilePeople">640×384（5:3 人物向け）</option>
              <option value="16fps-3x2" data-i18n="profileStable">576×384（3:2 安定）</option>
              <option value="16fps-4x3-resolution">512×384（4:3）</option>
              <option value="16fps-portrait-3x4" data-i18n="profilePortrait34">384×512（3:4 縦型）</option>
              <option value="16fps-portrait" data-i18n="profilePortrait35">384×640（3:5 縦型・実験）</option>
            </optgroup>
            <optgroup label="20fps・バランス" data-i18n-label="profile20">
              <option value="20fps-hq" selected>576×320（16:9）</option>
              <option value="20fps-4x3-balanced">512×384（4:3）</option>
            </optgroup>
            <optgroup label="24fps・動き優先" data-i18n-label="profile24">
              <option value="24fps-fast">512×288（16:9）</option>
              <option value="24fps-3x2">480×320（3:2）</option>
              <option value="24fps-portrait" data-i18n="profilePortrait916">288×512（9:16 縦型）</option>
            </optgroup>
          </select>
        </label>
        <label><span data-i18n="conversationLanguage">会話言語</span>
          <select name="conversation_language">
            <option value="auto" selected data-i18n="languageAuto">自動（入力に合わせる）</option>
            <option value="ja" data-i18n="languageJapanese">日本語</option>
            <option value="en" data-i18n="languageEnglish">英語</option>
          </select>
        </label>
        <div class="options">
          <label><span data-i18n="speakerId">話者ID</span><input name="voice_id" type="number" value="888753760"></label>
          <label><span data-i18n="chunkSeconds">チャンク秒数</span><input name="target_chunk_seconds" type="number" min="3.5" max="5" step="0.1" value="5"></label>
          <label><span data-i18n="preloadCount">先読み数</span><input name="startup_buffer_chunks" type="number" min="1" max="5" value="1"></label>
        </div>
        <button type="submit" data-i18n="setCharacter">キャラクターを設定</button>
      </form>
      <span class="drop-zone text-drop side-text-drop" id="text-drop">
        <input id="text-file" type="file" accept=".txt,text/plain">
        <span class="text-file-icon">TXT</span>
        <span class="drop-copy"><b data-i18n="dropText">TXTをドロップ</b><small>UTF-8・Shift_JIS</small></span>
      </span>
    </section>
    <section class="panel player-panel">
      <div class="status-row"><span id="status" data-i18n="idle">待機中</span><span id="buffer"></span></div>
      <div id="video-stack" class="video-stack">
        <img id="stage-character" class="stage-character" alt="設定したキャラクター" data-i18n-alt="configuredCharacter" hidden>
        <video id="player-a" class="active" controls playsinline preload="auto"></video>
        <video id="player-b" playsinline preload="auto"></video>
      </div>
      <p id="caption" data-i18n="captionPlaceholder">生成を開始すると、ここに読み上げ内容が表示されます。</p>
      <div id="assistant-live" class="assistant-live"></div>
      <form id="chat-form" class="chat-form">
        <div class="chat-entry">
          <textarea id="narration-text" rows="2" disabled placeholder="キャラクター設定後、メッセージを入力。Enterで送信、Shift+Enterで改行。" data-i18n-placeholder="messagePlaceholder"></textarea>
          <button type="submit" disabled data-i18n="send">送信</button>
        </div>
        <small id="text-file-name" class="file-name"></small>
      </form>
      <ol id="chunks"></ol>
    </section>
  </main>
  <script src="/static/app.js?v=10"></script>
</body>
</html>
