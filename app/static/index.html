<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Realtime Narration Video</title>
  <link rel="stylesheet" href="/static/style.css?v=16">
</head>
<body>
  <main>
    <header>
      <div class="header-row">
        <p class="eyebrow" id="engine-eyebrow">LTX-2.5 / AivisSpeech</p>
        <label class="language-picker"><span data-i18n="uiLanguage">表示言語</span>
          <select id="ui-language" aria-label="表示言語">
            <option value="ja">日本語</option>
            <option value="en">English</option>
          </select>
        </label>
      </div>
      <h1>Realtime Narration Video</h1>
      <p data-i18n="tagline">文章を約5秒ずつ音声化し、生成できた映像から順番に再生します。</p>
    </header>
    <section class="panel input-panel">
      <div id="preset-strip" class="preset-strip" hidden></div>
      <div class="narration-entry side-text-drop" id="text-drop">
        <label for="narration-source" data-i18n="narrationLabel">朗読させたい文章</label>
        <textarea id="narration-source" rows="7" placeholder="文章を入力・貼り付け、またはTXTファイルをドロップ" data-i18n-placeholder="narrationPlaceholder"></textarea>
        <div class="narration-tools">
          <label class="file-picker"><input id="text-file" type="file" accept=".txt,text/plain"><span data-i18n="selectTextFile">TXTを選択</span></label>
          <small id="text-file-name" class="file-name">UTF-8・Shift_JIS</small>
          <button id="narrate-button" type="button" disabled data-i18n="narrate">朗読</button>
        </div>
      </div>
      <form id="form">
        <input name="ui_language" id="ui-language-form" type="hidden" value="ja">
        <label class="setup-setting"><span data-i18n="characterImage">キャラクター画像</span>
          <span class="drop-zone image-drop" id="character-drop">
            <input name="character" id="character-input" type="file" accept="image/png,image/jpeg,image/webp" required>
            <img id="character-preview" alt="キャラクタープレビュー" data-i18n-alt="characterPreview" hidden>
            <span class="drop-copy"><b data-i18n="dropImage">画像をドロップ</b><small data-i18n="dropImageHint">PNG・JPEG・WebP／クリックして選択</small></span>
          </span>
        </label>
        <p class="settings-legend"><span class="live-key" data-i18n="liveSettingHint">緑枠：次の生成から即時反映</span><span class="setup-key" data-i18n="setupSettingHint">黄枠：設定ボタンで反映</span></p>
        <label class="live-setting"><span data-i18n="sceneDirection">映像の方向性</span><input name="concept" placeholder="落ち着いたスタジオで説明する" data-i18n-placeholder="scenePlaceholder"></label>
        <label class="live-setting"><span data-i18n="videoInstruction">動画への指示</span>
          <textarea name="video_instruction" rows="3" maxlength="1000" placeholder="例：話の要点で小さくうなずき、最後に微笑む" data-i18n-placeholder="videoInstructionPlaceholder"></textarea>
          <small class="setting-help" data-i18n="videoInstructionHint">次に生成する動画へ反映します。空欄なら自動生成します。</small>
        </label>
        <label class="live-setting"><span data-i18n="actionLevel">アクション量</span>
          <select name="action_level">
            <option value="low" selected data-i18n="actionLow">少なめ（安定重視）</option>
            <option value="medium" data-i18n="actionMedium">標準</option>
            <option value="high" data-i18n="actionHigh">多め（表現重視）</option>
          </select>
        </label>
        <label class="setup-setting"><span data-i18n="characterType">キャラクター種別</span>
          <select name="character_mode">
            <option value="standard" data-i18n="characterStandard">標準（イラスト・3D）</option>
            <option value="photoreal" selected data-i18n="characterPhotoreal">実写・口動作優先</option>
          </select>
        </label>
        <label class="live-setting"><span data-i18n="lipSetting">実写の発話設定</span>
          <select name="lip_sync_mode">
            <option value="natural" selected data-i18n="lipNatural">自然（閉口優先）</option>
            <option value="balanced" data-i18n="lipBalanced">バランス（軽い開口）</option>
            <option value="medium" data-i18n="lipMedium">中間1（やや強い）</option>
            <option value="medium_strong" data-i18n="lipMediumStrong">中間2（強め）</option>
            <option value="strong" data-i18n="lipStrong">強い口動作（大きい開口）</option>
          </select>
        </label>
        <label class="setup-setting"><span data-i18n="videoEngine">動画エンジン</span>
          <select name="video_engine" id="video-engine">
            <option value="ltx25" selected>LTX-2.5</option>
            <option value="h3">MiniMax-H3 (ref2va)</option>
          </select>
          <small class="setting-help" id="engine-hint" data-i18n="engineH3Hint" hidden>H3は24fps固定・H3専用の解像度のみ。リップシンクは音声に直接追従します。</small>
        </label>
        <label class="setup-setting"><span data-i18n="videoProfile">動画プロファイル</span>
          <select name="video_profile" id="video-profile">
            <optgroup label="H3・24fps固定" data-i18n-label="profileH3" data-engine="h3" hidden disabled>
              <option value="h3-portrait-352x640">352×640（縦・32GB級+8GB・推奨）</option>
              <option value="h3-portrait-352x608">352×608（縦・32GB級・保守）</option>
              <option value="h3-portrait-384x704">384×704（縦・96GB級）</option>
              <option value="h3-landscape-608x352">608×352（横・32GB級・要確認）</option>
              <option value="h3-landscape-704x384">704×384（横・96GB級・要確認）</option>
              <option value="h3-3x4-384x512">384×512（3:4・32GB級・要確認）</option>
              <option value="h3-portrait-320x448">320×448（縦・軽量・最速）</option>
              <option value="h3-4x3-512x384">512×384（4:3・32GB級・要確認）</option>
              <option value="h3-landscape-448x320">448×320（横・軽量・最速）</option>
              <option value="h3-3x4-416x544">416×544（3:4・96GB級・要確認）</option>
              <option value="h3-4x3-544x416">544×416（4:3・96GB級・要確認）</option>
            </optgroup>
            <optgroup label="16fps・解像度優先" data-i18n-label="profile16" data-engine="ltx25">
              <option value="16fps-5x3" data-i18n="profilePeople">640×384（5:3 人物向け）</option>
              <option value="16fps-3x2" data-i18n="profileStable">576×384（3:2 安定）</option>
              <option value="16fps-640x480">640×480（4:3 高解像度）</option>
              <option value="16fps-672x416">672×416（横 8:5）</option>
              <option value="16fps-704x416">704×416（横 17:10）</option>
              <option value="16fps-800x480">800×480（横 5:3 高解像度）</option>
              <option value="16fps-4x3-resolution">512×384（4:3）</option>
              <option value="16fps-portrait-3x4" data-i18n="profilePortrait34">384×512（3:4 縦型）</option>
              <option value="16fps-portrait" data-i18n="profilePortrait35">384×640（3:5 縦型・実験）</option>
              <option value="16fps-portrait-416x672">416×672（縦 5:8）</option>
              <option value="16fps-portrait-416x704">416×704（3:5 縦型・高解像度）</option>
              <option value="16fps-portrait-480x640">480×640（3:4 縦型・高解像度）</option>
              <option value="16fps-portrait-480x800">480×800（3:5 縦型・最高解像度）</option>
            </optgroup>
            <optgroup label="20fps・バランス" data-i18n-label="profile20" data-engine="ltx25">
              <option value="20fps-4x3-balanced" selected>512×384（4:3）</option>
              <option value="20fps-640x480">640×480（4:3 高解像度）</option>
              <option value="20fps-704x416">704×416（横 17:10）</option>
              <option value="20fps-portrait-480x640">480×640（3:4 縦型）</option>
              <option value="20fps-portrait-416x704">416×704（3:5 縦型）</option>
            </optgroup>
            <optgroup label="24fps・動き優先" data-i18n-label="profile24" data-engine="ltx25">
              <option value="24fps-3x2">480×320（3:2）</option>
              <option value="24fps-640x384">640×384（横 5:3）</option>
              <option value="24fps-704x416">704×416（横 17:10・上限）</option>
              <option value="24fps-portrait" data-i18n="profilePortrait916">288×512（9:16 縦型）</option>
              <option value="24fps-portrait-384x640">384×640（3:5 縦型）</option>
              <option value="24fps-portrait-416x704">416×704（3:5 縦型・上限）</option>
            </optgroup>
          </select>
        </label>
        <!-- アイドル動作(構図): IDLE_MOTION_PROFILES が全構図 1.0(2026-09-14 実測で
             スロー再生を廃止)になって以降どのエンジンでも無機能のため UI から隠す
             (2026-10-07)。値の保存互換のため DOM には残す。 -->
        <label class="setup-setting" hidden><span data-i18n="idleMotionProfile">アイドル動作（構図）</span>
          <select name="idle_motion_profile">
            <option value="closeup" data-i18n="idleCloseup">顔アップ（自然な小動作）</option>
            <option value="upper_body" data-i18n="idleUpperBody">上半身（動きを抑える）</option>
            <option value="wide" selected data-i18n="idleWide">膝上・全身（安定重視）</option>
          </select>
          <small class="setting-help" data-i18n="idleMotionHint">画像内に写っている範囲を選択してください。キャラクター設定時に反映します。</small>
        </label>
        <label class="setup-setting"><span data-i18n="idlePoolSize">待機動画の本数</span>
          <select name="idle_pool_size">
            <option value="3" data-i18n="idlePool3">3本（登録が速い）</option>
            <option value="4" data-i18n="idlePool4">4本</option>
            <option value="5" selected data-i18n="idlePool5">5本（追い生成が減り会話と衝突しにくい）</option>
            <option value="6" data-i18n="idlePool6">6本</option>
            <option value="7" data-i18n="idlePool7">7本（追い生成が最少・ランダム再生）</option>
          </select>
          <small class="setting-help" data-i18n="idlePoolHint">多いほど登録に時間がかかりますが、待機中の追い生成頻度が下がります。</small>
        </label>
        <div class="options">
          <label class="live-setting"><span data-i18n="speakerId">話者ID</span><input name="voice_id" type="number" value="888753760"></label>
          <label class="live-setting"><span data-i18n="videoSeed">動画seed</span><input name="video_seed" type="number" min="0" max="2147483647" step="1" value="1004"></label>
          <label class="live-setting"><span data-i18n="idleLiveliness">待機の動き</span>
            <select name="idle_liveliness">
              <option value="lively" selected data-i18n="idleLively">活発（動き優先・既定）</option>
              <option value="calm" data-i18n="idleCalm">静か（完全ループ）</option>
            </select>
          </label>
          <label class="live-setting"><span data-i18n="turnAnchorMode">会話開始画像</span>
            <select name="turn_anchor_mode">
              <option value="speaking" selected data-i18n="turnAnchorSpeaking">発話アンカー（口動作優先）</option>
              <option value="idle_frame" data-i18n="turnAnchorIdle">待機フレーム（連続性優先）</option>
            </select>
          </label>
          <label class="live-setting"><span data-i18n="turnEndMode">会話終了姿勢</span>
            <select name="turn_end_mode">
              <option value="free" selected data-i18n="turnEndFree">自由（従来・動き優先）</option>
              <option value="return_idle" data-i18n="turnEndReturn">待機ポーズへ戻る（連続性優先）</option>
            </select>
          </label>
          <label class="live-setting"><span data-i18n="cameraLock">カメラロック</span>
            <select name="camera_lock_enabled">
              <option value="true" data-i18n="cameraLockOn">有効（ドリフト固定）</option>
              <option value="false" selected data-i18n="cameraLockOff">無効（生成のまま）</option>
            </select>
          </label>
          <label class="live-setting"><span data-i18n="chunkSeconds">チャンク秒数</span><input name="target_chunk_seconds" type="number" min="3.5" max="5" step="0.1" value="5"></label>
          <label class="live-setting"><span data-i18n="preloadCount">先読み数</span><input name="startup_buffer_chunks" type="number" min="1" max="5" value="1"></label>
          <label class="live-setting"><span data-i18n="videoSteps">生成steps</span><input name="video_steps" type="number" min="1" max="12" step="1" value="4"></label>
          <label class="live-setting"><span data-i18n="modalityScale">口動作強調（scale 1.3）</span>
            <select name="modality_scale_enabled">
              <option value="true" data-i18n="scaleOn">有効</option>
              <option value="false" selected data-i18n="scaleOff">無効（高速）</option>
            </select>
          </label>
          <label class="live-setting"><span data-i18n="conversationLanguage">会話言語</span>
            <select name="conversation_language">
              <option value="auto" selected data-i18n="languageAuto">自動（入力に合わせる）</option>
              <option value="ja" data-i18n="languageJapanese">日本語</option>
              <option value="en" data-i18n="languageEnglish">英語</option>
            </select>
          </label>
        </div>
        <button type="submit" data-i18n="setCharacter">キャラクターを設定</button>
        <button type="button" id="save-preset" data-i18n="savePreset" hidden>このキャラクターを保存</button>
      </form>
    </section>
    <section class="panel player-panel">
      <div class="status-row"><span class="status-left"><button type="button" id="toggle-settings" class="panel-toggle" title="設定パネルを隠す" aria-label="設定パネルを隠す">◀ 設定</button><span id="status" data-i18n="idle">待機中</span></span><span id="buffer"></span></div>
      <div id="video-stack" class="video-stack">
        <img id="stage-character" class="stage-media" alt="設定したキャラクター" data-i18n-alt="configuredCharacter" hidden>
        <video id="stage-idle" class="stage-media stage-idle" muted autoplay playsinline preload="auto" aria-label="待機中のキャラクター" data-i18n-aria-label="idleCharacter" hidden></video>
        <video id="stage-idle-b" class="stage-media stage-idle" muted playsinline preload="auto" aria-label="待機中のキャラクター" data-i18n-aria-label="idleCharacter" hidden></video>
        <video id="player-a" class="speech-player active" controls playsinline preload="auto"></video>
        <video id="player-b" class="speech-player" playsinline preload="auto"></video>
        <button id="stage-pause" class="stage-pause" type="button" hidden aria-label="pause idle">⏸</button>
      </div>
      <p id="caption" data-i18n="captionPlaceholder">生成を開始すると、ここに読み上げ内容が表示されます。</p>
      <div id="assistant-live" class="assistant-live"></div>
      <form id="chat-form" class="chat-form">
        <div class="chat-entry">
          <textarea id="narration-text" rows="2" placeholder="テキストを入力・貼り付け。Enterで送信、Shift+Enterで改行。" data-i18n-placeholder="messagePlaceholder"></textarea>
          <button type="submit" disabled data-i18n="send">送信</button>
        </div>
        <small class="setting-help" data-i18n="inlineVideoInstructionHint">文頭に［手を上げながら］のように書くと、そのターンだけの動画指示になります。指示部分は読み上げません。</small>
      </form>
      <ol id="chunks"></ol>
    </section>
  </main>
  <script src="/static/app.js?v=56"></script>
</body>
</html>
